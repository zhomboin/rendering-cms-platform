name: 全量验证

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端与数据库
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cms_test
          POSTGRES_PASSWORD: cms_test
          POSTGRES_DB: cms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms_test -d cms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cms_test:cms_test@127.0.0.1:5432/cms_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: 安装查询生成器
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: 检查生成文件
        run: |
          sqlc generate
          git diff --exit-code -- internal/database/dbgen
      - name: 全量测试与静态检查
        run: |
          go test -count=1 ./...
          go vet ./...

  frontend:
    name: 前端与浏览器
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装锁定依赖与浏览器
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 构建与全量前端回归
        run: |
          npm run build
          npm run test:mdx-preview
          npm run test:albums
          npm run test:dashboard
